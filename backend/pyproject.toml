[tool.poetry]
name = "gluide-backend"
version = "0.1.0"
description = "Consolidated Django backend for Gluide application"
authors = ["Gluide Team"]
readme = "README.md"
packages = [{include = "api"}, {include = "gluideme"}, {include = "gluideai"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"
# Django and REST Framework
Django = "5.1.1"
djangorestframework = "3.15.2"
django-cors-headers = "^4.3.0"

# Database
psycopg2-binary = "^2.9.9"

# Celery for async tasks
celery = "^5.3.4"
django-celery-beat = "^2.5.0"
django-celery-results = "^2.5.1"
redis = "^5.0.1"

# External services
boto3 = "^1.34.0"  # AWS S3
pinecone-client = "^3.0.0"
meilisearch = "^0.31.0"
openai = "^1.12.0"

# Utilities
python-dotenv = "^1.0.0"
pillow = "^10.2.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
# Development tools
black = "^24.1.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-django = "^4.7.0"
pytest-cov = "^4.1.0"
django-debug-toolbar = "^4.2.0"
ipython = "^8.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
